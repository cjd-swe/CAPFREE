services:
  - type: web
    name: sharpwatch-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter  # $7/mo — never sleeps, keeps Telegram polling alive
    healthCheckPath: /health
    envVars:
      # Required — paste Supabase prod connection string (transaction pooler URI)
      - key: DATABASE_URL
        sync: false
      # Required — get from @BotFather; enables Telegram photo ingestion
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Required for hybrid/vision parse mode
      - key: ANTHROPIC_API_KEY
        sync: false
      # Comma-separated allowed origins. Set via Render dashboard:
      # https://frontend-two-silk-92.vercel.app,http://localhost:3000
      - key: CORS_ORIGINS
        sync: false
      # Optional: password-protect all routes
      - key: APP_PASSWORD
        sync: false
      # Auto-generated on first deploy — do not set manually
      - key: JWT_SECRET
        generateValue: true
      - key: PARSE_ENGINE
        value: hybrid
      - key: VISION_MODEL
        value: claude-haiku-4-5-20251001

crons:
  # Pings /health every 6 hours — keeps the Supabase free-tier DB from pausing
  - type: cron
    name: db-keep-alive
    runtime: image
    image:
      url: docker.io/curlimages/curl:8
    schedule: "0 */6 * * *"
    command: curl -sf https://sharpwatch-api.onrender.com/health

  # Auto-grades all pending picks every hour via ESPN
  - type: cron
    name: auto-grade
    runtime: image
    image:
      url: docker.io/curlimages/curl:8
    schedule: "0 * * * *"
    command: >-
      curl -sf -X POST https://sharpwatch-api.onrender.com/api/picks/auto-grade
      -H "Authorization: Bearer $APP_PASSWORD"
    envVars:
      - key: APP_PASSWORD
        sync: false
